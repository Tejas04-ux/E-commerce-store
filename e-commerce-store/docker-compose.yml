# App only:               docker compose up -d
# App + monitoring stack: docker compose --profile monitoring up -d
#   Prometheus -> http://<host>:9090    Grafana -> http://<host>:3000
services:
  app:
    image: ${DOCKERHUB_USERNAME:-trainwithshubham}/e-commerce-python:${IMAGE_TAG:-latest}
    ports:
      - "80:8080"
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    environment:
      # CHANGE THIS before exposing Grafana to the internet
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
